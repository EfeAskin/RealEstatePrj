<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - CypInvEst</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', path='htmlfotos/favicon.png') }}">
    <style>
        /* Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;800;900&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        html,
        body{
            width:100%;
            min-height:100%;
        }

        body{
            overflow-x:hidden;
        }

        .glass-container{
            min-height:100dvh;
            width:100%;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:20px;

            background:
            linear-gradient(
                rgba(0,0,0,0.4),
                rgba(0,0,0,0.4)
            ),
            url("/static/htmlfotos/loginspage.png")
            center center / cover no-repeat;
        }

        .glass-box{
            width:min(850px,95vw);
            min-height:500px;
            background:rgba(255,255,255,.85);

            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);

            border-radius:40px;

            box-shadow:
            0 0 60px rgba(59,130,246,.25),
            0 20px 50px rgba(0,0,0,.3);

            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;

            text-align:center;
            padding:60px;

            border:1px solid rgba(255,255,255,.4);

            position:relative;
            overflow:hidden;
        }

        .glass-box::before{
            content:"";
            position:absolute;
            top:-50%;
            left:-50%;
            width:200%;
            height:200%;

            background:
            radial-gradient(
                circle,
                rgba(212,163,115,.05) 0%,
                rgba(255,255,255,0) 70%
            );

            pointer-events:none;
        }

        /* --- BAŞLIK ALANI DÜZENLEMESİ (KAYMALARI ENGELLER) --- */
        .welcome-title{
            position:relative;
            z-index:2;
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            align-items:center;
            gap:12px;
            line-height:1.2;
            width:100%;
        }

        .brand-group {
            display:inline-flex;
            align-items:center;
            white-space:nowrap; /* Marka adının PC'de kırılmasını kesin olarak önler */
        }

        .welcome-text{
            color:#1e293b;
            font-weight:800;
            font-size:clamp(2rem,4.5vw,3.5rem);
        }

        .cyp,
        .inv,
        .est{
            font-size:clamp(2.3rem,5.5vw,4.2rem);
            font-weight:900;
        }

        .cyp{ color:#D4A373; }
        .inv{ color:#1E88E5; }
        .est{ color:#2E7D32; }

        .dot{
            display:inline-block;
            width:12px;
            height:12px;
            background:#D4A373;
            border-radius:50%;
            margin-left:6px;
            box-shadow:0 0 10px rgba(212,163,115,.6);
            vertical-align:middle;
        }

        .choose-text{
            margin:35px 0 30px;
            color:#64748b;
            font-size:clamp(14px,2vw,20px);
            font-weight:600;
            letter-spacing:2px;
            text-transform:uppercase;
            position:relative;
            z-index:2;
        }

        .btn-group{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:18px;
            position:relative;
            z-index:2;
            width:100%;
        }

        .btn{
            min-width:180px;
            padding:16px 32px;
            border-radius:15px;
            color:white;
            text-decoration:none;
            font-weight:700;
            font-size:16px;
            transition:.3s;
            box-shadow:0 10px 20px rgba(0,0,0,.1);
        }

        .btn-user{ background:#3b82f6; }
        .btn-agent{ background:#FB8500; }
        .btn-admin{ background:#A4161A; }

        .btn:hover{
            transform:translateY(-5px);
            filter:brightness(1.05);
        }

        .slogan{
            margin-top:40px;
            color:#94a3b8;
            font-size:14px;
            font-weight:500;
            position:relative;
            z-index:2;
        }

        /* --- MOBİL UYUMLULUK KURALLARI --- */
        @media (max-width:768px){
            .glass-container{
                padding:16px;
            }

            .glass-box{
                width:100%;
                min-height:auto;
                padding:45px 20px;
                border-radius:28px;
            }

            /* Mobilde 'Welcome to' üstte kalır, marka ismi tek parça halinde şıkça alta iner */
            .welcome-title{
                flex-direction:column;
                gap:8px;
            }

            .brand-group {
                flex-wrap:nowrap; /* Mobilde de markanın bölünmesini engeller */
            }

            .btn-group{
                width:100%;
                flex-direction:column;
                align-items:center;
            }

            .btn{
                width:100%;
                max-width:320px;
                min-width:auto;
            }

            .slogan{
                margin-top:30px;
                font-size:13px;
            }
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <div class="glass-box">
            
            <h1 class="welcome-title">
                <span class="welcome-text">Welcome to</span>
                <span class="brand-group">
                    <span class="cyp">Cyp</span><span class="inv">Inv</span><span class="est">Est</span><span class="dot"></span>
                </span>
            </h1>
            
            <p class="choose-text">Choose Your Role</p>
            
            <div class="btn-group">
                <a href="/login/user" class="btn btn-user">User Portal</a>
                <a href="/login/agent" class="btn btn-agent">Agent Space</a>
                <a href="/login/admin" class="btn btn-admin">Management</a>
            </div>

            <p class="slogan">AI-Powered Real Estate Ecosystem of Cyprus</p>
        </div>
    </div>
</body>
</html>
